<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMail Pro · Premium Email</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #f0f2f5; --card: #ffffff; --text: #1a1f36; --text2: #5f6368;
      --primary: #1a73e8; --success: #0d904f; --danger: #d93025;
      --warning: #e37400; --border: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 14px; --gold: #f5a623; --premium: #7c3aed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { max-width: 1150px; margin: 0 auto; padding: 12px; }

    .header {
      background: var(--card); padding: 14px 22px; border-radius: var(--radius);
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow); margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .verified-badge {
      background: linear-gradient(135deg, #7c3aed, #a78bfa); color: white;
      padding: 3px 10px; border-radius: 15px; font-size: 0.7rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .plan-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .plan-free { background: #e8eaed; color: #5f6368; }
    .plan-basic { background: #e8f0fe; color: #1a73e8; }
    .plan-gold { background: #fef7e0; color: #e37400; }
    .plan-premium { background: #ede9fe; color: #7c3aed; }

    .btn {
      padding: 9px 18px; border-radius: 22px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-gold { background: linear-gradient(135deg, #f5a623, #f7b955); color: white; }
    .btn-premium { background: linear-gradient(135deg, #7c3aed, #a78bfa); color: white; }
    .btn-sm { padding: 6px 14px; font-size: 0.78rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .main-layout { display: flex; gap: 12px; }
    .sidebar {
      width: 210px; background: var(--card); border-radius: var(--radius);
      padding: 12px; box-shadow: var(--shadow); flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar .menu-item {
      padding: 11px 14px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; font-weight: 500;
      transition: 0.15s; margin-bottom: 2px; border: none; background: none;
      width: 100%; text-align: left; font-size: 0.88rem; color: var(--text);
    }
    .sidebar .menu-item:hover { background: #f0f2f5; }
    .sidebar .menu-item.active { background: #e8f0fe; color: var(--primary); font-weight: 700; }
    .sidebar .menu-item .count { margin-left: auto; background: var(--primary); color: white; padding: 2px 7px; border-radius: 10px; font-size: 0.7rem; }
    .content-area { flex: 1; min-width: 0; }
    .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 3px; color: var(--text2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.3px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%; padding: 10px 12px; border: 2px solid var(--border);
      border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit; background: var(--card); color: var(--text);
    }
    .input-group input:focus, .input-group textarea:focus { border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .email-toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .email-list { max-height: 480px; overflow-y: auto; }
    .email-row {
      padding: 9px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.1s; font-size: 0.85rem;
    }
    .email-row:hover { background: #f8f9fa; }
    .email-row.unread { background: #f2f6fc; font-weight: 600; }
    .email-row.selected { background: #e8f0fe; }
    .email-row .sender { min-width: 130px; }
    .email-row .subject { flex: 1; }
    .email-row .preview { color: #5f6368; font-size: 0.8rem; }
    .email-row .time { color: #5f6368; font-size: 0.72rem; min-width: 60px; text-align: right; }
    .star-btn { cursor: pointer; font-size: 0.95rem; background: none; border: none; }
    .empty-state { text-align: center; padding: 35px; color: #5f6368; }
    .limit-warning {
      background: #fef3c7; border: 1px solid #f59e0b; border-radius: 10px;
      padding: 12px; margin-bottom: 10px; font-size: 0.85rem; color: #92400e;
    }
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .plan-card {
      border: 2px solid var(--border); border-radius: var(--radius); padding: 18px;
      text-align: center; transition: 0.2s; position: relative;
    }
    .plan-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .plan-card.featured { border-color: var(--gold); background: #fffdf5; }
    .plan-card.premium-card { border-color: var(--premium); background: #faf5ff; }
    .plan-card.current { border-color: var(--success); }
    .plan-card .plan-badge-current {
      position: absolute; top: -10px; right: 10px; background: var(--success);
      color: white; padding: 3px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 700;
    }
    .plan-price { font-size: 2rem; font-weight: 800; margin: 6px 0; }
    .plan-features { list-style: none; text-align: left; margin: 10px 0; font-size: 0.82rem; }
    .plan-features li { padding: 3px 0; }
    .plan-features li::before { content: '✓ '; color: var(--success); font-weight: 700; }
    .plan-features li.x::before { content: '✗ '; color: var(--danger); }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center;
      justify-content: center; z-index: 1000; backdrop-filter: blur(3px);
    }
    .modal-box { background: var(--card); border-radius: 18px; padding: 22px; max-width: 500px; width: 92%; max-height: 85vh; overflow-y: auto; }
    .notification {
      position: fixed; top: 15px; right: 15px; padding: 12px 18px;
      border-radius: 10px; color: white; font-weight: 600; z-index: 2000;
      animation: slideIn 0.3s ease; box-shadow: 0 6px 20px rgba(0,0,0,0.2); max-width: 380px;
    }
    @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
    .notif-success { background: var(--success); }
    .notif-error { background: var(--danger); }
    .notif-info { background: var(--primary); }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.78rem; }
    .mt-1 { margin-top: 5px; }
    .mt-2 { margin-top: 10px; }
    .mt-3 { margin-top: 15px; }
    .storage-bar {
      height: 8px; background: var(--border); border-radius: 4px; margin-top: 4px; overflow: hidden;
    }
    .storage-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: 0.3s; }
    .storage-fill.warning { background: var(--warning); }
    .storage-fill.danger { background: var(--danger); }
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .sidebar .menu-item { width: auto; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app" id="appRoot"></div>
<div id="notificationArea"></div>

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyDLSnWPSjF8Qf2mQ9zc2HfvpTH8dPzIrL8",
    authDomain: "demobatta-1b673.firebaseapp.com",
    databaseURL: "https://demobatta-1b673-default-rtdb.firebaseio.com",
    projectId: "demobatta-1b673",
    storageBucket: "demobatta-1b673.firebasestorage.app",
    messagingSenderId: "609366383941",
    appId: "1:609366383941:web:11f782595e3bd4f855722c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ==================== PLANS CONFIG ====================
  const PLANS = {
    free: {
      name: 'Free', price: 0, inboxLimit: 10, emailsPerDay: 5,
      features: ['10 Inbox Messages','5 Emails/Day','Basic Support'],
      verified: false, customSig: false, templates: false, filters: false
    },
    basic: {
      name: 'Basic', price: 499, inboxLimit: 10, emailsPerDay: 100,
      features: ['10 Inbox Messages','100 Emails/Day','Priority Support','No Ads'],
      verified: false, customSig: true, templates: false, filters: false
    },
    gold: {
      name: 'Gold', price: 999, inboxLimit: 20, emailsPerDay: 500,
      features: ['20 Inbox Messages','500 Emails/Day','24/7 Support','No Ads','Custom Signature','Email Templates'],
      verified: false, customSig: true, templates: true, filters: true
    },
    premium: {
      name: 'Premium', price: 1999, inboxLimit: 999999, emailsPerDay: 999999,
      features: ['Unlimited Inbox','Unlimited Emails','Dedicated Support','No Ads','Custom Signature','Email Templates','Advanced Filters','✅ Verified Badge','AI Assistant','Custom Domain'],
      verified: true, customSig: true, templates: true, filters: true, aiAssistant: true, customDomain: true
    }
  };

  const CURRENCY = 'LKR';
  const ADMIN_EMAIL = 'admin@metabank.com';
  const FEE_PERCENT = 3;

  // ==================== STATE ====================
  const state = {
    user: null, emails: [], selectedEmails: new Set(),
    currentFolder: 'inbox', composeOpen: false,
    planModalOpen: false, paymentModalOpen: false, selectedPlan: null,
    dailySent: 0, activeSubscription: null
  };

  function showNotification(msg, type='info') {
    const area = document.getElementById('notificationArea');
    const div = document.createElement('div');
    div.className = `notification notif-${type}`; div.textContent = msg;
    area.appendChild(div);
    setTimeout(() => { div.style.opacity='0'; div.style.transform='translateX(120%)'; setTimeout(()=>div.remove(),300); }, 4000);
  }
  function formatCurrency(a) { return a.toLocaleString('en-US',{minimumFractionDigits:2}); }
  function formatTime(ts) {
    if(!ts) return ''; const d=new Date(ts), n=new Date();
    if(n-d<86400000) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString();
  }
  function escapeHtml(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ==================== EMAIL API ====================
  async function sendEmailAPI(to, from, subject, body) {
    const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2,8);
    await db.ref('allEmails/' + msgId).set({
      id: msgId, to: to.toLowerCase().trim(), from: from.trim(),
      subject: subject.trim(), body: body.trim(),
      timestamp: Date.now(), read: false, starred: false, deleted: false
    });
    return msgId;
  }

  async function fetchAllUserEmails(userEmail) {
    const snap = await db.ref('allEmails').once('value');
    const emails = [];
    snap.forEach(c => {
      const e = c.val();
      if (e && (e.to === userEmail.toLowerCase() || e.from === userEmail.toLowerCase())) {
        emails.push({ id: c.key, ...e });
      }
    });
    emails.sort((a,b) => b.timestamp - a.timestamp);
    return emails;
  }

  function getFilteredEmails() {
    let f;
    switch(state.currentFolder) {
      case 'sent': f = state.emails.filter(e => e.from === state.user?.email); break;
      case 'starred': f = state.emails.filter(e => e.starred); break;
      default: f = state.emails.filter(e => e.to === state.user?.email); break;
    }
    return f.filter(e => !e.deleted).sort((a,b) => b.timestamp - a.timestamp);
  }

  function getInboxCount() {
    return state.emails.filter(e => e.to === state.user?.email && !e.deleted).length;
  }

  function getInboxLimit() {
    return PLANS[state.user?.plan]?.inboxLimit || 10;
  }

  function isInboxFull() {
    return getInboxCount() >= getInboxLimit();
  }

  async function loadEmails() {
    if (!state.user) return;
    state.emails = await fetchAllUserEmails(state.user.email);
    const today = new Date().setHours(0,0,0,0);
    state.dailySent = state.emails.filter(e => e.from === state.user.email && e.timestamp >= today).length;
    render();
  }

  // ==================== GLOBAL ACTIONS ====================
  window.switchFolder = function(f) { state.currentFolder=f; state.selectedEmails.clear(); state.composeOpen=false; render(); };
  window.openCompose = function() {
    const limit = PLANS[state.user.plan].emailsPerDay;
    if (state.dailySent >= limit && limit !== 999999) { showNotification(`Daily send limit (${limit}) reached! Upgrade.`,'error'); return; }
    state.composeOpen=true; render();
  };
  window.closeCompose = function() { state.composeOpen=false; render(); };
  window.sendComposeEmail = async function() {
    const to=document.getElementById('composeTo')?.value.trim();
    const subj=document.getElementById('composeSubject')?.value.trim();
    const body=document.getElementById('composeBody')?.value.trim();
    const msg=document.getElementById('composeMsg');
    if(!to||!subj||!body){ if(msg)msg.innerHTML='<span style="color:var(--danger);">❌ All fields required</span>'; return; }
    const limit=PLANS[state.user.plan].emailsPerDay;
    if(state.dailySent>=limit && limit!==999999){ if(msg)msg.innerHTML='<span style="color:var(--danger);">❌ Daily limit reached</span>'; return; }
    await sendEmailAPI(to, state.user.email, subj, body);
    showNotification('✅ Email sent!','success'); state.composeOpen=false; await loadEmails();
  };
  window.toggleSelect = function(id) { state.selectedEmails.has(id)?state.selectedEmails.delete(id):state.selectedEmails.add(id); render(); };
  window.deleteSelected = async function() {
    if(!state.selectedEmails.size){ showNotification('Select emails first','error'); return; }
    for(const id of state.selectedEmails) await db.ref('allEmails/'+id+'/deleted').set(true);
    state.selectedEmails.clear(); await loadEmails(); showNotification('🗑️ Deleted! Space freed.','success');
  };
  window.markReadSelected = async function() {
    if(!state.selectedEmails.size){ showNotification('Select emails','error'); return; }
    for(const id of state.selectedEmails) await db.ref('allEmails/'+id+'/read').set(true);
    state.selectedEmails.clear(); await loadEmails(); showNotification('📖 Marked read!','success');
  };
  window.starSelected = async function() {
    if(!state.selectedEmails.size){ showNotification('Select emails','error'); return; }
    for(const id of state.selectedEmails){ const e=state.emails.find(x=>x.id===id); await db.ref('allEmails/'+id+'/starred').set(!e?.starred); }
    state.selectedEmails.clear(); await loadEmails(); showNotification('⭐ Updated!','success');
  };
  window.toggleStar = async function(id) { const e=state.emails.find(x=>x.id===id); await db.ref('allEmails/'+id+'/starred').set(!e?.starred); await loadEmails(); };
  window.openEmail = async function(id) {
    const e=state.emails.find(x=>x.id===id); if(!e) return;
    await db.ref('allEmails/'+id+'/read').set(true);
    const otp=e.body?.match(/\b(\d{6})\b/);
    alert(`📧 ${e.subject}\nFrom: ${e.from}\nTo: ${e.to}\n${new Date(e.timestamp).toLocaleString()}\n\n${e.body||''}${otp?'\n\n🔑 OTP: '+otp[1]:''}`);
    await loadEmails();
  };
  window.refreshEmails = async function() { await loadEmails(); showNotification('🔄 Refreshed!','info'); };
  window.openPlansModal = function() { state.planModalOpen=true; render(); };
  window.closePlansModal = function() { state.planModalOpen=false; render(); };
  window.selectPlan = function(plan) {
    if(state.user.plan===plan){ showNotification('Already on this plan','error'); return; }
    state.selectedPlan=plan; state.planModalOpen=false; state.paymentModalOpen=true; render();
  };
  window.closePaymentModal = function() { state.paymentModalOpen=false; state.selectedPlan=null; render(); };

  // ==================== PAYMENT ====================
  window.processManualPayment = async function() {
    const cardNum = document.getElementById('cardNumber')?.value.trim().replace(/\s/g,'');
    const expiry = document.getElementById('cardExpiry')?.value.trim();
    const cvv = document.getElementById('cardCvv')?.value.trim();
    const statusEl = document.getElementById('payStatus');
    const btn = document.getElementById('payNowBtn');
    
    if (!cardNum || !expiry || !cvv) { if(statusEl) statusEl.innerHTML='<span style="color:var(--danger);">❌ All fields required</span>'; return; }
    if (cardNum.length < 15) { if(statusEl) statusEl.innerHTML='<span style="color:var(--danger);">❌ Invalid card number</span>'; return; }
    if (btn) { btn.disabled=true; btn.textContent='⏳ Processing...'; }
    
    try {
      const allCardsSnap = await db.ref('virtualCards').once('value');
      let foundCard = null;
      allCardsSnap.forEach(c => { const card=c.val(); if(card&&card.cardNumber===cardNum) foundCard={id:c.key,...card}; });
      if (!foundCard) throw new Error('Card not found in banking system.');
      if (foundCard.status!=='active') throw new Error('Card is not active.');
      
      const planPrice = PLANS[state.selectedPlan].price;
      const fee = planPrice * FEE_PERCENT / 100;
      const total = planPrice + fee;
      
      const ownerKey = foundCard.userEmail.replace(/\./g,'_');
      const ownerSnap = await db.ref('bankUsers/' + ownerKey).once('value');
      const ownerData = ownerSnap.val();
      if (!ownerData) throw new Error('Bank account not found.');
      if (ownerData.balance < total) throw new Error(`Insufficient balance! Need ${CURRENCY} ${formatCurrency(total)}.`);
      
      // Check if user already has active subscription
      const userKey = state.user.email.replace(/\./g,'_');
      const subSnap = await db.ref('subscriptions/' + userKey).once('value');
      if (subSnap.exists()) {
        const existing = subSnap.val();
        if (existing.status === 'active' && existing.plan !== 'free') {
          throw new Error(`You already have ${existing.plan.toUpperCase()} plan! Wait until it expires or upgrade to higher plan.`);
        }
      }
      
      // Deduct from card owner
      const newBal = ownerData.balance - total;
      await db.ref('bankUsers/' + ownerKey + '/balance').set(newBal);
      
      // Fee to admin
      const adminKey = ADMIN_EMAIL.replace(/\./g,'_');
      const adminSnap = await db.ref('bankUsers/' + adminKey).once('value');
      if (adminSnap.exists()) await db.ref('bankUsers/' + adminKey + '/balance').set((adminSnap.val().balance||0) + fee);
      
      // Save subscription
      const expiry = Date.now() + (30*24*60*60*1000);
      await db.ref('subscriptions/' + userKey).set({
        plan: state.selectedPlan, price: planPrice, fee, total,
        cardLast4: cardNum.slice(-4), cardOwnerEmail: foundCard.userEmail,
        startDate: Date.now(), expiryDate: expiry, status: 'active', paymentId: 'pay_'+Date.now()
      });
      
      // Save payment record
      const payId = 'pay_' + Date.now();
      await db.ref('payments/' + payId).set({
        id: payId, userEmail: state.user.email, plan: state.selectedPlan,
        amount: planPrice, fee, total, cardLast4: cardNum.slice(-4), timestamp: Date.now()
      });
      
      // Upgrade user
      await db.ref('emailUsers/' + userKey).update({ plan: state.selectedPlan, planExpiry: expiry, verified: PLANS[state.selectedPlan].verified });
      state.user.plan = state.selectedPlan;
      state.user.planExpiry = expiry;
      state.activeSubscription = { plan: state.selectedPlan, expiryDate: expiry, status: 'active' };
      
      await sendEmailAPI(state.user.email, 'billing@metamail.com', '🧾 Subscription Activated - ' + PLANS[state.selectedPlan].name,
        `Plan: ${PLANS[state.selectedPlan].name}\nAmount: ${CURRENCY} ${formatCurrency(planPrice)}\nFee: ${CURRENCY} ${formatCurrency(fee)}\nTotal: ${CURRENCY} ${formatCurrency(total)}\nCard: ****${cardNum.slice(-4)}\nValid until: ${new Date(expiry).toLocaleDateString()}\n\nEnjoy your new features!`);
      
      showNotification(`✅ Upgraded to ${PLANS[state.selectedPlan].name}!`,'success');
      state.paymentModalOpen=false; state.selectedPlan=null; render();
    } catch(err) {
      showNotification('❌ ' + err.message,'error');
      if(statusEl) statusEl.innerHTML=`<span style="color:var(--danger);">${err.message}</span>`;
      if(btn) { btn.disabled=false; btn.textContent='💰 Pay Now'; }
    }
  };

  window.logout = function() { state.user=null; state.emails=[]; state.selectedEmails.clear(); state.composeOpen=false; state.planModalOpen=false; state.paymentModalOpen=false; db.ref('allEmails').off(); render(); };
  window.handleLogin = async function() {
    const email=document.getElementById('authEmail')?.value.trim().toLowerCase();
    const pass=document.getElementById('authPass')?.value.trim();
    const err=document.getElementById('authErr');
    if(!email||!pass){ if(err)err.textContent='All fields required'; return; }
    const key=email.replace(/\./g,'_');
    const snap=await db.ref('emailUsers/'+key).once('value');
    const u=snap.val();
    if(!u){ if(err)err.textContent='Account not found'; return; }
    if(u.password!==pass){ if(err)err.textContent='Wrong password'; return; }
    
    // Load subscription
    const subSnap = await db.ref('subscriptions/'+key).once('value');
    const sub = subSnap.val();
    
    state.user = {
      email: u.email, plan: u.plan||'free', planExpiry: u.planExpiry||0,
      verified: u.verified||false
    };
    
    // Check if subscription expired
    if (sub && sub.status==='active' && Date.now() > sub.expiryDate) {
      await db.ref('subscriptions/'+key).update({status:'expired'});
      await db.ref('emailUsers/'+key).update({plan:'free', verified:false});
      state.user.plan = 'free';
      state.user.verified = false;
      showNotification('⚠️ Your subscription expired. Downgraded to Free plan.','error');
    }
    
    state.activeSubscription = sub && sub.status==='active' && Date.now() <= sub.expiryDate ? sub : null;
    await loadEmails();
  };
  window.handleRegister = async function() {
    const email=document.getElementById('authEmail')?.value.trim().toLowerCase();
    const pass=document.getElementById('authPass')?.value.trim();
    const err=document.getElementById('authErr');
    if(!email||!pass||pass.length<6){ if(err)err.textContent='Invalid (min 6 chars)'; return; }
    const key=email.replace(/\./g,'_');
    if((await db.ref('emailUsers/'+key).once('value')).exists()){ if(err)err.textContent='Email exists'; return; }
    await db.ref('emailUsers/'+key).set({email,password:pass,plan:'free',planExpiry:0,verified:false,createdAt:Date.now()});
    state.user={email,plan:'free',planExpiry:0,verified:false};
    state.activeSubscription=null;
    await loadEmails();
    showNotification('✅ Account created! Free plan.','success');
  };

  // ==================== RENDER ====================
  function render() {
    document.getElementById('appRoot').innerHTML = state.user ? renderMainApp() : renderAuthScreen();
  }

  function renderAuthScreen() {
    return `<div class="card" style="max-width:420px;margin:50px auto;">
      <h1 style="text-align:center;color:var(--primary);">📧 MetaMail Pro</h1>
      <p style="text-align:center;color:var(--text2);margin-bottom:18px;">Premium Email Service</p>
      <div class="input-group"><label>Email</label><input id="authEmail" placeholder="you@mail.com" autocomplete="off"></div>
      <div class="input-group"><label>Password</label><input type="password" id="authPass" placeholder="Password"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="handleLogin()">Sign In</button>
      <button class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="handleRegister()">Create Account</button>
      <div class="text-center mt-2" style="color:var(--danger);min-height:18px;" id="authErr"></div>
    </div>`;
  }

  function renderMainApp() {
    const plan = PLANS[state.user.plan];
    const planClass = `plan-${state.user.plan}`;
    const inboxCount = getInboxCount();
    const inboxLimit = getInboxLimit();
    const inboxFull = inboxCount >= inboxLimit && inboxLimit !== 999999;
    const unread = state.emails.filter(e=>!e.read&&!e.deleted&&e.to===state.user.email).length;
    
    return `<div class="header">
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="logo">📧 MetaMail Pro</span>
        <span class="plan-badge ${planClass}">${plan.name}</span>
        ${state.user.verified ? '<span class="verified-badge">✅ Verified</span>' : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="color:var(--text2);font-size:0.85rem;">${state.user.email}</span>
        ${state.activeSubscription ? `<span style="font-size:0.7rem;color:var(--text2);">Expires: ${new Date(state.activeSubscription.expiryDate).toLocaleDateString()}</span>` : ''}
        <button class="btn btn-outline btn-sm" onclick="openPlansModal()">⬆️ Upgrade</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="main-layout">
      <div class="sidebar">
        <button class="menu-item ${state.currentFolder==='inbox'?'active':''}" onclick="switchFolder('inbox')">📥 Inbox <span class="count">${inboxCount}/${inboxLimit===999999?'∞':inboxLimit}</span></button>
        <button class="menu-item ${state.currentFolder==='sent'?'active':''}" onclick="switchFolder('sent')">📤 Sent</button>
        <button class="menu-item ${state.currentFolder==='starred'?'active':''}" onclick="switchFolder('starred')">⭐ Starred</button>
        <hr style="margin:8px 0;border-color:var(--border);">
        <div style="font-size:0.75rem;color:var(--text2);padding:5px 10px;">
          Storage: ${inboxCount}/${inboxLimit===999999?'∞':inboxLimit}
          <div class="storage-bar"><div class="storage-fill ${inboxFull?'danger':inboxCount>inboxLimit*0.8?'warning':''}" style="width:${inboxLimit===999999?0:Math.min(100,(inboxCount/inboxLimit)*100)}%"></div></div>
        </div>
        <hr style="margin:8px 0;border-color:var(--border);">
        <button class="menu-item" onclick="openPlansModal()">💎 Upgrade</button>
        ${state.user.verified ? '<div class="menu-item" style="color:var(--premium);">✅ Verified Account</div>' : ''}
        ${plan.templates ? '<div class="menu-item">📋 Templates</div>' : ''}
        ${plan.filters ? '<div class="menu-item">🔍 Smart Filters</div>' : ''}
      </div>
      <div class="content-area">
        ${inboxFull && state.currentFolder==='inbox' ? `<div class="limit-warning">⚠️ Inbox full (${inboxCount}/${inboxLimit})! Delete old messages or <a style="color:var(--primary);cursor:pointer;font-weight:700;" onclick="openPlansModal()">Upgrade Plan</a> to receive more.</div>` : ''}
        ${state.composeOpen ? renderCompose() : renderEmailList()}
      </div>
    </div>
    ${state.planModalOpen ? renderPlansModal() : ''}
    ${state.paymentModalOpen ? renderPaymentModal() : ''}`;
  }

  function renderEmailList() {
    const emails = getFilteredEmails();
    return `<div class="card">
      <div class="email-toolbar">
        <button class="btn btn-primary btn-sm" onclick="openCompose()">✍️ Compose</button>
        <button class="btn btn-outline btn-sm" onclick="deleteSelected()">🗑️ Delete</button>
        <button class="btn btn-outline btn-sm" onclick="markReadSelected()">📖 Read</button>
        <button class="btn btn-outline btn-sm" onclick="starSelected()">⭐ Star</button>
        <button class="btn btn-outline btn-sm" onclick="refreshEmails()">🔄</button>
        <span style="margin-left:auto;font-size:0.78rem;color:var(--text2);">${state.selectedEmails.size} selected</span>
      </div>
      <div class="email-list">${emails.length ? emails.map(e=>`
        <div class="email-row ${e.read?'':'unread'} ${state.selectedEmails.has(e.id)?'selected':''}" onclick="openEmail('${e.id}')">
          <input type="checkbox" ${state.selectedEmails.has(e.id)?'checked':''} onclick="event.stopPropagation();toggleSelect('${e.id}')">
          <button class="star-btn" onclick="event.stopPropagation();toggleStar('${e.id}')">${e.starred?'⭐':'☆'}</button>
          <span class="sender">${escapeHtml(state.currentFolder==='sent'?'To: '+e.to:e.from)}</span>
          <span class="subject">${escapeHtml(e.subject||'(none)')}</span>
          <span class="preview">${escapeHtml((e.body||'').substring(0,30))}...</span>
          <span class="time">${formatTime(e.timestamp)}</span>
        </div>`).join('') : '<div class="empty-state">📭 No emails</div>'}</div>
    </div>`;
  }

  function renderCompose() {
    return `<div class="card"><h3>✍️ Compose</h3>
      <p style="font-size:0.78rem;color:var(--text2);">Sent today: ${state.dailySent}/${PLANS[state.user.plan].emailsPerDay===999999?'∞':PLANS[state.user.plan].emailsPerDay}</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
      <div class="input-group"><label>To</label><input id="composeTo" placeholder="recipient@mail.com"></div>
      <div class="input-group"><label>Subject</label><input id="composeSubject" placeholder="Subject"></div>
      <div class="input-group"><label>Message</label><textarea id="composeBody" rows="6"></textarea></div>
      <div style="display:flex;gap:6px;"><button class="btn btn-primary" onclick="sendComposeEmail()">🚀 Send</button>
      <button class="btn btn-outline" onclick="closeCompose()">Cancel</button></div>
      <div id="composeMsg" style="min-height:18px;"></div></div></div>`;
  }

  function renderPlansModal() {
    const currentPlan = state.user.plan;
    return `<div class="modal-overlay" onclick="if(event.target===this)closePlansModal()">
      <div class="modal-box" style="max-width:750px;"><h2>💎 Upgrade Plan</h2>
      <p style="color:var(--text2);">Current: <strong>${PLANS[currentPlan].name}</strong> ${state.activeSubscription?'· Expires: '+new Date(state.activeSubscription.expiryDate).toLocaleDateString():''}</p>
      <div class="plans-grid mt-3">${Object.entries(PLANS).map(([k,p])=>`
        <div class="plan-card ${k==='gold'?'featured':''} ${k==='premium'?'premium-card':''} ${k===currentPlan?'current':''}">
          ${k===currentPlan?'<div class="plan-badge-current">Current</div>':''}
          <h3>${p.name} ${p.verified?'✅':''}</h3>
          <div class="plan-price">${p.price===0?'Free':CURRENCY+' '+formatCurrency(p.price)}<span style="font-size:0.8rem;">${p.price>0?'/mo':''}</span></div>
          <ul class="plan-features">
            <li class="${p.inboxLimit===999999?'':'x'}">${p.inboxLimit===999999?'Unlimited':p.inboxLimit} Inbox</li>
            <li class="${p.emailsPerDay===999999?'':'x'}">${p.emailsPerDay===999999?'Unlimited':p.emailsPerDay} Emails/Day</li>
            ${p.features.slice(2).map(f=>`<li>${f}</li>`).join('')}
          </ul>
          <button class="btn ${k==='premium'?'btn-premium':k==='gold'?'btn-gold':'btn-primary'}" 
            onclick="selectPlan('${k}')" style="width:100%;" ${k===currentPlan?'disabled':''}>
            ${k===currentPlan?'Current Plan':'Choose '+p.name}
          </button>
        </div>`).join('')}</div>
      <p style="color:var(--text2);font-size:0.75rem;margin-top:8px;text-align:center;">⚠️ You can only have ONE active subscription at a time.</p>
      <button class="btn btn-outline mt-2" style="width:100%;" onclick="closePlansModal()">Close</button></div></div>`;
  }

  function renderPaymentModal() {
    const p=PLANS[state.selectedPlan]; const fee=p.price*FEE_PERCENT/100;
    return `<div class="modal-overlay" onclick="if(event.target===this)closePaymentModal()">
      <div class="modal-box"><h2>💳 Card Payment</h2>
      <p><strong>Plan:</strong> ${p.name} · <strong>${CURRENCY} ${formatCurrency(p.price)}/mo</strong></p>
      <p style="color:var(--warning);">Fee (3%): ${CURRENCY} ${formatCurrency(fee)}</p>
      <p style="font-weight:700;">Total: ${CURRENCY} ${formatCurrency(p.price+fee)}</p>
      <hr style="margin:12px 0;border-color:var(--border);">
      <div class="input-group"><label>Card Number</label><input id="cardNumber" placeholder="0000000000000000" maxlength="19"></div>
      <div class="row">
        <div class="input-group"><label>Expiry</label><input id="cardExpiry" placeholder="MM/YY" maxlength="5"></div>
        <div class="input-group"><label>CVV</label><input id="cardCvv" placeholder="123" maxlength="4"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;" id="payNowBtn" onclick="processManualPayment()">💰 Pay ${CURRENCY} ${formatCurrency(p.price+fee)}</button>
      <div id="payStatus" style="margin-top:8px;min-height:18px;text-align:center;"></div>
      <p style="color:var(--text2);font-size:0.7rem;text-align:center;margin-top:5px;">💡 Enter any valid MetaBank card. System auto-detects account.</p>
      <button class="btn btn-outline mt-2" style="width:100%;" onclick="closePaymentModal()">Cancel</button></div></div>`;
  }

  // ==================== REAL-TIME ====================
  db.ref('allEmails').on('child_added', (snap) => {
    if (!state.user) return;
    const e = snap.val();
    if (e && (e.to === state.user.email || e.from === state.user.email)) {
      const inboxCount = getInboxCount();
      const limit = getInboxLimit();
      if (e.to === state.user.email && inboxCount >= limit && limit !== 999999) {
        console.warn('⚠️ Inbox full! Email received but user must upgrade to see it.');
      }
      loadEmails();
    }
  });
  db.ref('allEmails').on('child_changed', () => { if(state.user) loadEmails(); });

  render();
  console.log('📧 MetaMail Pro Ready');
  console.log('📊 Plans: Free(10) | Basic(10) | Gold(20) | Premium(∞)');
  console.log('🔒 One subscription at a time · Auto-expiry check');
  console.log('✅ Premium = Verified badge + Unlimited everything');
</script>
</body>
</html>
