<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Call App</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; }
        video { width: 300px; height: 225px; background: #000; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .controls { background: white; padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #my-id { font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

    <h2>Video Call Website</h2>
    <div class="controls">
        <p>Your ID: <span id="my-id">...connecting...</span></p>
        <input type="text" id="remote-id" placeholder="Paste Remote Peer ID here">
        <button onclick="makeCall()">Call</button>
    </div>

    <div class="video-container">
        <div><p>Local (You)</p><video id="local-video" autoplay muted></video></div>
        <div><p>Remote (Friend)</p><video id="remote-video" autoplay></video></div>
    </div>

    <script>
        const peer = new Peer(); // Creates a connection to PeerJS Cloud
        let localStream;

        // 1. Get User Media (Camera/Mic)
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
        });

        // 2. Display your unique ID
        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
        });

        // 3. Handle incoming calls
        peer.on('call', call => {
            call.answer(localStream); // Answer with your stream
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });

        // 4. Function to start a call
        function makeCall() {
            const remoteId = document.getElementById('remote-id').value;
            const call = peer.call(remoteId, localStream);
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }
    </script>
</body>
</html>
